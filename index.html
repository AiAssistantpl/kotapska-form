<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="robots" content="noindex">
<title>KOTAPSKA - Stock request</title>
<style>
:root{--bg:#fff;--panel:#e1e1e1;--tx:#7a7c7c;--mut:#b5b1ac;--ink:#4a4c4c;--line:#cfcdca;--ok:#4f7a5a;--err:#b5493f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--panel:#2a2a2a;--tx:#d9d6d2;--mut:#8f8b86;--ink:#ece9e5;--line:#444;--ok:#8fc29d;--err:#e08a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cera Pro',Montserrat,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 56px}
.top{text-align:center;padding:8px 0 24px}.top .l{letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--mut)}
.brand{font-size:32px;letter-spacing:.14em;color:var(--tx);margin:6px 0 2px;font-weight:600}
.sub{font-family:'Lucette','Libre Caslon Text',Georgia,serif;font-style:italic;color:var(--mut)}
h1{font-family:'Lucette','Libre Caslon Text',Georgia,serif;font-style:italic;font-weight:400;font-size:32px;line-height:1.2;text-align:center;margin:8px 0 10px;color:var(--ink)}
.lead{text-align:center;margin:0 0 26px}
.card{background:var(--panel);padding:26px 22px;border-radius:2px}
label{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:16px 0 6px;color:var(--tx)}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:13px 12px;border-radius:0;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tx);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;text-transform:none;letter-spacing:0;font-size:15px}
.chk input{margin-top:5px;width:20px;height:20px;flex:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
button{margin-top:22px;width:100%;min-height:54px;background:transparent;border:2px solid var(--tx);color:var(--tx);font:inherit;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button:hover,button:focus-visible{background:var(--tx);color:var(--bg)}button[disabled]{opacity:.5;cursor:wait}
.msg{margin-top:16px;padding:14px;display:none;font-size:15px}.msg.err{display:block;color:var(--err);border:1px solid var(--err)}
.done{display:none;text-align:center;padding:32px 20px;background:var(--panel)}.done h2{font-family:'Lucette',Georgia,serif;font-style:italic;font-weight:400;font-size:28px;color:var(--ink);margin:0 0 10px}
.done a.btn{display:inline-block;margin-top:14px;padding:16px 26px;border:2px solid var(--tx);color:var(--tx);text-decoration:none;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.hp{position:absolute;left:-9999px;opacity:0}
.fine{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
.lang{text-align:right;font-size:12px;letter-spacing:.14em}.lang a{color:var(--mut);text-decoration:none;margin-left:8px}.lang a.on{color:var(--ink);text-decoration:underline}
</style></head><body><div class="wrap">
<div class="lang" id="lang"></div>
<div class="top"><div class="l">est - 2002</div><div class="brand">KOTAPSKA</div><div class="sub">Bridal Couture</div></div>
<h1 id="t_h1"></h1><p class="lead" id="t_lead"></p>
<form id="f" class="card" novalidate>
<label for="salon" id="t_salon"></label><input type="text" id="salon" name="salon" autocomplete="organization" required>
<div class="row"><div><label for="name" id="t_name"></label><input type="text" id="name" name="name" autocomplete="name" required></div>
<div><label for="country" id="t_country"></label><input type="text" id="country" name="country" autocomplete="country-name" required></div></div>
<div class="row"><div><label for="email" id="t_email"></label><input type="email" id="email" name="email" autocomplete="email" required></div>
<div><label for="phone" id="t_phone"></label><input type="tel" id="phone" name="phone" autocomplete="tel"></div></div>
<label id="t_need"></label>
<label class="chk"><input type="checkbox" name="need" value="price list" checked><span id="t_n1"></span></label>
<label class="chk"><input type="checkbox" name="need" value="personal selection"><span id="t_n2"></span></label>
<label class="chk"><input type="checkbox" name="need" value="call back"><span id="t_n3"></span></label>
<label for="models" id="t_models"></label><textarea id="models" name="models"></textarea>
<label class="chk" style="margin-top:20px"><input type="checkbox" id="consent" name="consent" required><span id="t_consent"></span></label>
<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button type="submit" id="send"></button><div class="msg" id="msg" role="alert"></div>
</form>
<div class="done" id="done" role="status"><h2 id="t_ok"></h2><p id="t_ok2"></p><a class="btn" id="cat" href="#" target="_blank" rel="noopener"></a></div>
<p class="fine" id="t_fine"></p></div>
<script>
// НАСТРОЙКИ: заполнить перед публикацией
var ENDPOINT = "https://api.smartai-crm.com/webhook/kotapska-stock-request";      // адрес webhook n8n, куда уходит заявка (POST, JSON)
var CATALOG_URL = "";   // публичная ссылка на PDF каталога (Google Drive)
var TXT={
en:{h1:"Request stock prices",lead:"Tell us a little about your salon and we will send prices and availability within one business day.",salon:"Salon name *",name:"Your name *",country:"Country *",email:"Email *",phone:"Phone or WhatsApp",need:"What do you need?",n1:"Price list for stock models",n2:"A personal selection for my salon",n3:"A call back",models:"Models of interest (numbers, sizes)",consent:"I agree that KOTAPSKA may contact me about this request. *",send:"Send request",ok:"Thank you",ok2:"We have received your request and will reply within one business day.",cat:"Download catalogue (PDF)",err:"Please fill in all required fields correctly.",fail:"Could not send. Please try again or write to office@kotapska.com.",fine:"KOTAPSKA Bridal Couture, Komarova St. 11, Chernivtsi, Ukraine"},
fr:{h1:"Demander les prix du stock",lead:"Présentez-nous brièvement votre salon : nous vous enverrons les prix et la disponibilité sous un jour ouvré.",salon:"Nom du salon *",name:"Votre nom *",country:"Pays *",email:"E-mail *",phone:"Téléphone ou WhatsApp",need:"De quoi avez-vous besoin ?",n1:"Liste des prix des modèles en stock",n2:"Une sélection personnelle pour mon salon",n3:"Un rappel téléphonique",models:"Modèles qui vous intéressent (numéros, tailles)",consent:"J'accepte que KOTAPSKA me contacte au sujet de cette demande. *",send:"Envoyer la demande",ok:"Merci",ok2:"Nous avons bien reçu votre demande et vous répondrons sous un jour ouvré.",cat:"Télécharger le catalogue (PDF)",err:"Veuillez remplir correctement tous les champs obligatoires.",fail:"Envoi impossible. Réessayez ou écrivez à office@kotapska.com.",fine:"KOTAPSKA Bridal Couture, rue Komarova 11, Tchernivtsi, Ukraine"},
de:{h1:"Preise für Lagerware anfragen",lead:"Erzählen Sie uns kurz von Ihrem Salon. Preise und Verfügbarkeit senden wir innerhalb eines Werktags.",salon:"Name des Salons *",name:"Ihr Name *",country:"Land *",email:"E-Mail *",phone:"Telefon oder WhatsApp",need:"Was benötigen Sie?",n1:"Preisliste für Lagermodelle",n2:"Eine persönliche Auswahl für meinen Salon",n3:"Einen Rückruf",models:"Gewünschte Modelle (Nummern, Größen)",consent:"Ich bin einverstanden, dass KOTAPSKA mich zu dieser Anfrage kontaktiert. *",send:"Anfrage senden",ok:"Vielen Dank",ok2:"Wir haben Ihre Anfrage erhalten und antworten innerhalb eines Werktags.",cat:"Katalog herunterladen (PDF)",err:"Bitte füllen Sie alle Pflichtfelder korrekt aus.",fail:"Senden nicht möglich. Bitte erneut versuchen oder an office@kotapska.com schreiben.",fine:"KOTAPSKA Bridal Couture, Komarova-Str. 11, Tscherniwzi, Ukraine"},
uk:{h1:"Запит цін на сток",lead:"Розкажіть коротко про ваш салон, і ми надішлемо ціни та наявність протягом одного робочого дня.",salon:"Назва салону *",name:"Ваше ім'я *",country:"Країна *",email:"Email *",phone:"Телефон або WhatsApp",need:"Що вам потрібно?",n1:"Прайс на моделі зі стоку",n2:"Персональна добірка для мого салону",n3:"Зворотний дзвінок",models:"Цікаві моделі (номери, розміри)",consent:"Погоджуюсь, що KOTAPSKA зв'яжеться зі мною щодо цього запиту. *",send:"Надіслати запит",ok:"Дякуємо",ok2:"Ми отримали ваш запит і відповімо протягом одного робочого дня.",cat:"Завантажити каталог (PDF)",err:"Будь ласка, правильно заповніть усі обов'язкові поля.",fail:"Не вдалося надіслати. Спробуйте ще раз або напишіть на office@kotapska.com.",fine:"KOTAPSKA Bridal Couture, вул. Комарова, 11, Чернівці, Україна"}};
var q=new URLSearchParams(location.search),L=(q.get("lang")||(navigator.language||"en").slice(0,2)).toLowerCase();if(!TXT[L])L="en";
var T=TXT[L];document.documentElement.lang=L;
function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v}
["h1","lead","salon","name","country","email","phone","need","n1","n2","n3","models","consent","fine"].forEach(function(k){set("t_"+k,T[k])});
set("send",T.send);set("t_ok",T.ok);set("t_ok2",T.ok2);set("cat",T.cat);
document.getElementById("lang").innerHTML=["en","fr","de","uk"].map(function(c){return '<a href="?lang='+c+'" class="'+(c==L?"on":"")+'">'+c.toUpperCase()+'</a>'}).join("");
if(q.get("model"))document.getElementById("models").value=q.get("model");
var cat=document.getElementById("cat");if(CATALOG_URL)cat.href=CATALOG_URL;else cat.style.display="none";
var f=document.getElementById("f"),msg=document.getElementById("msg"),btn=document.getElementById("send");
f.addEventListener("submit",function(ev){ev.preventDefault();msg.className="msg";msg.textContent="";
 var d=new FormData(f);if(d.get("website"))return;
 var email=(d.get("email")||"").trim();
 if(!d.get("salon").trim()||!d.get("name").trim()||!d.get("country").trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!f.consent.checked){msg.className="msg err";msg.textContent=T.err;return}
 var p={salon:d.get("salon").trim(),name:d.get("name").trim(),country:d.get("country").trim(),email:email,phone:(d.get("phone")||"").trim(),need:d.getAll("need"),models:(d.get("models")||"").trim(),consent:true,lang:L,
  utm_source:q.get("utm_source")||"",utm_medium:q.get("utm_medium")||"",utm_campaign:q.get("utm_campaign")||"",utm_content:q.get("utm_content")||"",page:location.origin+location.pathname,ts:new Date().toISOString()};
 if(!ENDPOINT){msg.className="msg err";msg.textContent=T.fail;return}
 btn.disabled=true;
 fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0;f.style.display="none";document.getElementById("done").style.display="block"}).catch(function(){msg.className="msg err";msg.textContent=T.fail;btn.disabled=false});
});
</script></body></html>
